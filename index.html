  <script>
    // Stripe can append client secrets and payment references to return URLs.
    // Remove them before any analytics or third-party script can observe the URL.
    (() => {
      try {
        const url = new URL(window.location.href);
        const params = url.searchParams;
        const setupIntentId = params.get('setup_intent') || '';
        const hasSetupReturn = /^seti_[A-Za-z0-9_]+$/.test(setupIntentId)
          && params.has('setup_intent_client_secret');
        const checkoutSessionId = params.get('session_id') || '';
        const hasStripeReturnParams = hasSetupReturn
          || checkoutSessionId
          || ['setup_intent', 'setup_intent_client_secret', 'payment_intent', 'payment_intent_client_secret', 'redirect_status', 'card_setup']
            .some(key => params.has(key));
        if (!hasStripeReturnParams) return;

        try {
          const state = JSON.parse(sessionStorage.getItem('rozare_stripe_return_v1') || '{}');
          if (hasSetupReturn) {
            state.paymentMethodSetup = {
              path: url.pathname,
              redirectStatus: params.get('redirect_status') || '',
              receivedAt: Date.now(),
            };
          }
          if (/^cs_[A-Za-z0-9_]+$/.test(checkoutSessionId)) {
            state.checkoutSession = {
              id: checkoutSessionId,
              path: url.pathname,
              orderId: params.get('orderId') || '',
              receivedAt: Date.now(),
            };
          }
          sessionStorage.setItem('rozare_stripe_return_v1', JSON.stringify(state));
        } catch (_) {}
        [
          'setup_intent',
          'setup_intent_client_secret',
          'payment_intent',
          'payment_intent_client_secret',
          'redirect_status',
          'session_id',
          'card_setup',
        ].forEach(key => params.delete(key));
        window.history.replaceState({}, document.title, `${url.pathname}${params.toString() ? `?${params}` : ''}${url.hash}`);
      } catch (_) {}
    })();
  </script>

  <!-- GSM Cashback Tracking Script -->
  <script>
  (function() {
    window.GSM = {
      brandId: '697b9599afb2ae3c366b6753',
      apiUrl: 'https://gsm-v2-api-5ffdf926b962.herokuapp.com',
      init: function() {
        var urlParams = new URLSearchParams(window.location.search);
        var trackingCode = urlParams.get('gsm_tracking');
        if (trackingCode) {
          localStorage.setItem('gsm_tracking_code', trackingCode);
          localStorage.setItem('gsm_tracking_expires', Date.now() + 7*24*60*60*1000);
        }
      },
      trackPurchase: function(data) {
        var trackingCode = localStorage.getItem('gsm_tracking_code');
        var expires = localStorage.getItem('gsm_tracking_expires');
        if (!trackingCode) return Promise.resolve({ success: false, message: 'No tracking code' });
        if (Date.now() > parseInt(expires)) {
          localStorage.removeItem('gsm_tracking_code');
          localStorage.removeItem('gsm_tracking_expires');
          return Promise.resolve({ success: false, message: 'Tracking code expired' });
        }
        return fetch(this.apiUrl + '/purchases/webhook/purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trackingCode: trackingCode,
            orderId: data.orderId,
            amount: data.amount,
            currency: data.currency || 'USD',
            customerEmail: data.customerEmail || '',
            purchaseDate: new Date().toISOString(),
            status: 'completed'
          })
        })
        .then(function(response) { return response.json(); })
        .then(function(result) {
          if (result.success) {
            localStorage.removeItem('gsm_tracking_code');
            localStorage.removeItem('gsm_tracking_expires');
          }
          return result;
        })
        .catch(function(err) {
          return { success: false, error: err.message };
        });
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() { window.GSM.init(); });
    } else {
      window.GSM.init();
    }
  })();
  </script>
