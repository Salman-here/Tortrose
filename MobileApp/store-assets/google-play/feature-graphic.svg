<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="48" y1="26" x2="960" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="0.52" stop-color="#EEF9FF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20C4BD"/>
      <stop offset="0.53" stop-color="#1FA6EE"/>
      <stop offset="1" stop-color="#5B63F4"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EBFFFD"/>
      <stop offset="1" stop-color="#E8ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#20587F" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#244F76" flood-opacity="0.12"/>
    </filter>
    <clipPath id="logoClip"><rect x="74" y="112" width="156" height="156" rx="42"/></clipPath>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="862" cy="72" r="174" fill="#B9FFF6" opacity="0.32"/>
  <circle cx="945" cy="400" r="242" fill="#CBD2FF" opacity="0.37"/>
  <circle cx="41" cy="458" r="132" fill="#CCF7FF" opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="74" y="112" width="156" height="156" rx="42" fill="url(#brand)"/>
    <g clip-path="url(#logoClip)">
      <image href="../../assets/icon.png" x="74" y="112" width="156" height="156" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>

  <text x="74" y="321" fill="#14243C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="760" letter-spacing="-1.4">Rozare</text>
  <text x="74" y="366" fill="#32506E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Shop smarter. Sell simpler.</text>
  <text x="74" y="404" fill="#60748C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Marketplace shopping with helpful AI built in.</text>

  <g transform="translate(512 72)" filter="url(#cardShadow)">
    <rect width="207" height="357" rx="31" fill="#FFFFFF" stroke="#DDEAF5" stroke-width="2"/>
    <rect x="22" y="24" width="98" height="13" rx="6.5" fill="#14243C"/>
    <circle cx="167" cy="30" r="10" fill="#EAF3FA"/>
    <rect x="22" y="58" width="163" height="96" rx="22" fill="url(#soft)"/>
    <path d="M84 116c15-25 27-40 42-40 17 0 26 18 43 52H55c10-17 19-27 29-12Z" fill="url(#brand)" opacity="0.92"/>
    <circle cx="76" cy="86" r="11" fill="#FFDA73"/>
    <rect x="22" y="176" width="104" height="12" rx="6" fill="#1C304B"/>
    <rect x="22" y="197" width="151" height="8" rx="4" fill="#D9E4EC"/>
    <rect x="22" y="214" width="124" height="8" rx="4" fill="#E6EDF3"/>
    <rect x="22" y="246" width="48" height="31" rx="12" fill="#F0F6FA"/>
    <rect x="78" y="246" width="48" height="31" rx="12" fill="#F0F6FA"/>
    <rect x="22" y="296" width="163" height="39" rx="15" fill="url(#brand)"/>
    <text x="103.5" y="321" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Add to cart</text>
  </g>

  <g transform="translate(744 101)" filter="url(#cardShadow)">
    <rect width="214" height="148" rx="26" fill="#FFFFFF" stroke="#DDEAF5" stroke-width="2"/>
    <circle cx="34" cy="34" r="18" fill="url(#brand)"/>
    <path d="M27 34h14M34 27v14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="31" fill="#1C304B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="750">Rozare AI</text>
    <text x="62" y="50" fill="#7690A8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">Shopping assistant</text>
    <rect x="22" y="75" width="168" height="50" rx="16" fill="#EEF7FF"/>
    <text x="36" y="96" fill="#34516B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Find something perfect</text>
    <text x="36" y="113" fill="#34516B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">for your style and budget.</text>
  </g>

  <g transform="translate(729 278)" filter="url(#cardShadow)">
    <rect width="242" height="136" rx="26" fill="#FFFFFF" stroke="#DDEAF5" stroke-width="2"/>
    <text x="22" y="32" fill="#1C304B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750">Your store today</text>
    <text x="22" y="65" fill="#14243C" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="780">24 orders</text>
    <rect x="22" y="92" width="198" height="10" rx="5" fill="#EDF3F7"/>
    <rect x="22" y="92" width="138" height="10" rx="5" fill="url(#brand)"/>
    <text x="22" y="122" fill="#168B82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Live insights and store tools</text>
  </g>

  <g opacity="0.72">
    <circle cx="490" cy="60" r="5" fill="#20BDB5"/>
    <circle cx="981" cy="260" r="7" fill="#5B63F4"/>
    <circle cx="455" cy="455" r="6" fill="#1FA6EE"/>
  </g>
</svg>

